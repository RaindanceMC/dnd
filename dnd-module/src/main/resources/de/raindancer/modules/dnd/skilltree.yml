# The adventurer's skill tree, read by Core's SkillTree. Five branches, each filling five columns by three rows (at:
# [column, row]); a node needs ONE of what it `requires` (a neighbour in its branch, joined by a line) and is shut while
# one of what it `excludes` is taken. `effects` are per rank (Perk.java says what each means and caps them), `cost` is
# skill points per rank, `level` the adventurer level the first rank needs and `level-step` how many more each further
# rank needs. A skill point comes with every adventurer level.
branches:
  vitality:
    title: Vitality
    icon: golden_apple
    blurb: More hearts, harder skin, a body that mends and will not die.
  might:
    title: Might
    icon: iron_sword
    blurb: Harder, faster blows; two blades at once, or one great one.
  marksman:
    title: Marksman
    icon: bow
    blurb: Arrows that hit harder, fly further and come back.
  shadow:
    title: Shadow
    icon: leather_boots
    blurb: Quick feet, blows that miss you, knives in the back.
  arcana:
    title: Arcana
    icon: enchanted_book
    blurb: Experience, treasure, and the magic items' full strength.

