id: adventurer
title: Adventurers
summary: Level up by playing and spend a skill point every level in a skill tree of five branches.
intro: |
  Everything you do out there — digging, farming, fishing, trading, exploring — makes you a little better at it. {run:/adventurer} opens your skill tree, and everything below hangs off it.
icon: ENCHANTED_BOOK
category: Progress & rewards
order: 40
module: dnd
aliases: [adventurer, adventurers, dnd, character, skill-tree, skilltree, perks, hero, rpg, levels, xp]
keywords: [level, experience, skill, point, tree, branch, node, feat, capstone, dual wielder, hearts, damage, dodge]
commands: [adventurer]
related: [adventurer-tree, adventurer-items]
sections:
  - question: What is this?
    title: The idea
    text: |
      You are an <white>adventurer</white> from your first minute here. Playing gives adventurer experience, experience gives levels (1 to 100), and every level gives a <white>skill point</white>. Spend them in the skill tree on more hearts, harder blows, better arrows, quicker feet and stronger magic items — and on feats like <white>Dual Wielder</white>.
      {if:dnd:worlds}Adventurers only work in these worlds: <white>{setting:dnd:worlds}</white>. Elsewhere the tree gives nothing and kills earn nothing — your hero is kept, not lost.{else}Adventurers work in every world.{/if}
  - question: How do I gain levels?
    title: Experience
    text: |
      By playing. Every minute you are not away is worth 10 experience. Mining an ore the world made is worth 5 times its rarity (coal 5, iron 10, diamond 40, ancient debris 75) — never an ore somebody placed. A fully grown crop 2, a melon or pumpkin the world grew 2, a fish 15, breeding or a trade 10, each enchanting level spent 20, an advancement 150, a raid won 1,000, and bosses far more: elder guardian 1,000, wither and warden 3,000, ender dragon 5,000. {if:dnd:xp-percent != 100}This server awards <white>{setting:dnd:xp-percent|percent}</white> of those numbers.{/if}{if:dnd:xp-percent == 0} Levelling is switched off.{/if}
      <white>Ordinary monsters earn nothing</white>, so a mob farm does not level you. Nothing counts while you are away.
      Level 2 needs 300, level 3 900, level 5 6,500, level 20 355,000; every level after that 25,000 more, up to 100.
  - question: I had a class before. Where did it go?
    title: From before the tree
    text: |
      Classes, spells, dice and rests are gone. You keep your level and experience, and every skill point those levels bring is yours to spend — open {run:/adventurer}. Your magic items still work; old spell scrolls became the scroll closest to their spell, at a matching strength.
  - question: Is my hero saved?
    title: Keeping your hero
    text: |
      Your hero is saved on the server (and shared across the network), every few seconds and when you leave. If it cannot be read, nothing about it can change until staff fix that — it never overwrites newer progress with older.
