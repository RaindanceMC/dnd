id: adventurer
title: Adventurers
summary: Level up by slaying monsters and spend a skill point every level in a skill tree of five branches.
intro: |
  Every monster you put down makes you a little better at putting down the next one. {run:/adventurer} opens your skill tree, and everything below hangs off it.
icon: ENCHANTED_BOOK
category: Progress & rewards
order: 40
module: dnd
aliases: [adventurer, adventurers, dnd, character, skill-tree, skilltree, perks, hero, rpg, levels, xp]
keywords: [level, experience, skill, point, tree, branch, node, feat, capstone, dual wielder, hearts, damage, dodge]
commands: [adventurer]
related: [adventurer-tree, adventurer-items]
sections:
  - question: What is this?
    title: The idea
    text: |
      You are an <white>adventurer</white> from the first monster you defeat. Monsters give adventurer experience, experience gives levels (1 to 100), and every level gives a <white>skill point</white>. Spend them in the skill tree on more hearts, harder blows, better arrows, quicker feet and stronger magic items — and on feats like <white>Dual Wielder</white>.
      {if:dnd:worlds}Adventurers only work in these worlds: <white>{setting:dnd:worlds}</white>. Elsewhere the tree gives nothing and kills earn nothing — your hero is kept, not lost.{else}Adventurers work in every world.{/if}
  - question: How do I gain levels?
    title: Experience
    text: |
      By defeating monsters. A zombie or skeleton is worth 50 experience, a creeper or witch 100, a blaze or wither skeleton 200, a ravager or evoker 450, and bosses far more: elder guardian 1,800, warden 5,000, wither 10,000, ender dragon 20,000. {if:dnd:xp-percent != 100}This server awards <white>{setting:dnd:xp-percent|percent}</white> of those numbers.{else}This server uses those numbers exactly.{/if}{if:dnd:xp-percent == 0} Levelling from kills is switched off.{/if}
      Level 2 needs 300, level 3 900, level 5 6,500, level 20 355,000; every level after that 25,000 more, up to 100.
  - question: I had a class before. Where did it go?
    title: From before the tree
    text: |
      Classes, spells, dice and rests are gone. You keep your level and experience, and every skill point those levels bring is yours to spend — open {run:/adventurer}. Your magic items still work; old spell scrolls became the scroll closest to their spell, at a matching strength.
  - question: Is my hero saved?
    title: Keeping your hero
    text: |
      Your hero is saved on the server (and shared across the network), every few seconds and when you leave. If it cannot be read, nothing about it can change until staff fix that — it never overwrites newer progress with older.
