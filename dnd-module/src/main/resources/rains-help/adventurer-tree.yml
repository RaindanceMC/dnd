id: adventurer-tree
title: The adventurer's skill tree
summary: Five branches of fifteen nodes — Vitality, Might, Marksman, Shadow, Arcana — with a choice and a capstone each.
intro: |
  Points are few and the tree is big. A hundred levels fill about three of the five branches, so choose what kind of adventurer you are.
icon: NETHER_STAR
category: Progress & rewards
order: 41
module: dnd
aliases: [skill-tree-adventurer, adventurer-skills, feats, dual-wielder, unlearn, respec]
keywords: [branch, node, rank, choice, capstone, feat, dual wielder, second wind, undying, unlearn, points]
commands: [adventurer]
related: [adventurer, adventurer-items]
sections:
  - question: How does the tree work?
    title: Branches and nodes
    text: |
      {run:/adventurer} shows one branch a page; the arrows at the bottom turn between them. Click a node to learn its next rank: it costs skill points (most cost one, choices two, capstones three) and many ranks need an adventurer level. A node needs one next to it learnt first, and a line lights up once both its ends are learnt. Each branch has one <white>choice</white> — learning one side shuts the other — and ends in a <white>capstone</white> at level 30.
  - question: What is in each branch?
    title: The five branches
    text: |
      <white>Vitality</white>: more hearts, armour and toughness, less damage taken, healing out of a fight, less hunger; Second Wind or Stoneskin; capstone <white>Undying</white>. <white>Might</white>: melee damage, faster attacks, critical and sweeping blows, lifesteal, reach, rage below half health; <white>Dual Wielder</white> or Great Weapon Master; capstone Warlord. <white>Marksman</white>: arrow damage, Long Shot from twenty blocks, arrows not used up; Volley or Sharpshooter; capstone Deadeye. <white>Shadow</white>: speed, dodging, higher jumps, softer falls, blows from behind; Acrobat or Assassin; capstone Phantom. <white>Arcana</white>: more experience, magic items found more often, luck, faster mining, stronger scrolls, wands and potions; Sage or Treasure Hunter; capstone Archmage.
  - question: What do the feats do?
    title: Feats
    text: |
      <white>Dual Wielder</white>: hold a weapon in your off hand and every melee blow is followed by a strike from it, for half its damage. <white>Second Wind</white>: dropping below a third of your health heals you a third, once every two minutes. <white>Undying</white>: a blow that would kill you leaves you one heart instead, once every ten minutes — a totem in your hand goes first.
  - question: Does it count against players?
    title: Between players
    text: |
      Hearts and armour always count. Of the damage, dodging and damage-taken bonuses, <white>{setting:dnd:pvp-percent|percent}</white> counts when players fight each other. Whether players can hurt each other at all is the server's PvP rule.
  - question: Can I unlearn it?
    title: Unlearning
    text: |
      Shift-click the middle button at the bottom of a tree page: every node goes and every point comes back to spend again. You can do it once every <white>{setting:dnd:unlearn-hours|number}</white> hour(s).
