id: adventurer-staff
title: Adventurers for Staff
summary: Setting levels, granting experience, resting, resetting, handing out magic items, triggering surges.
intro: |
  Playing god with other people's characters. The commands all name a player who must be online, and they work on one at a time.
icon: COMMAND_BLOCK
category: Staff
order: 45
module: dnd
permission: rainsadventurers.admin
aliases: [adventurer-admin, dnd-admin, adminadventurer]
keywords: [admin, level, xp, reset, give, surge, rest, item, scroll]
related: [adventurer, adventurer-items]
sections:
  - question: What can I do to a player's hero?
    title: Admin commands
    text: |
      {cmd:/adventurer admin level <player> <level>} sets their level (1-20; going up earns points, going down never takes any back). {cmd:/adventurer admin xp <player> <amount>} grants experience. {cmd:/adventurer admin rest <player>} gives a long rest, whatever the wait. {cmd:/adventurer admin reset <player>} deletes their hero — they choose a class again; ask first, it cannot be undone.
  - question: How do I give magic items?
    title: Giving items
    text: |
      {cmd:/adventurer admin give <player> <item> [spell]} gives an item by id (tab-completion lists them: potion_of_healing, weapon_plus_one, wand_of_magic_missiles, bag_of_holding and the rest). For a spell scroll, name the spell: <white>spell_scroll fireball</white>.
  - question: How do I test wild magic?
    title: Surges
    text: |
      {cmd:/adventurer admin surge <player> [number]} makes a surge happen — a random entry, or one of the 100 by number.
  - question: Where are the numbers?
    title: Settings
    permission: rainscore.settings
    text: |
      {cmd:/settings} has pages for adventurers: experience and health, spell damage, resting, the casting stance, loot and whether ability scores exist.
