id: skills-foraging
title: Foraging
summary: The Foraging skill — more berries and honey, flowers and mushrooms twice, rare finds and bone meal that goes further.
intro: |
  Whatever grows wild is yours to gather. {run:/skills foraging} shows the tree.
icon: SWEET_BERRIES
category: Progress & rewards
order: 49
