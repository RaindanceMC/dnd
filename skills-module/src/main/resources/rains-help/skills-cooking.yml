sections:
  - question: What does the Kitchen give?
    title: Kitchen
    text: |
      A furnace or smoker you opened last cooks food faster and burns its fuel longer, and food you take out of it may come with an extra serving. The choice is Big Pot (more servings) or Charcoal Burner (fuel lasts much longer), the capstone Head Cook, the mastery badge <gold>Master Chef</gold>: food cooks in a moment.
  - question: What does the Table give?
    title: Table
    text: |
      Food fills you more — hunger and saturation — and a cooked meal blesses you for a while: meat with resistance, fish with water breathing, bread and baked potatoes with haste, stews with regeneration, pies and cookies with speed. The choice is <white>Iron Stomach</white> (rotten flesh, raw chicken, spider eyes and pufferfish do not make you sick) or Gourmet (longer blessings), the capstone Host, the mastery badge <gold>Feast</gold>: a meal you eat feeds the players within eight blocks too, half as much.
