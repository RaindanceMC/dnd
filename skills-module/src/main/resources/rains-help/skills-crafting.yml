id: skills-crafting
title: Artisan, Building, Trading, Enchanting, Exploration
summary: The skills of making, building, trading, enchanting and travelling — what each tree's branches do.
intro: |
  Five skills for everything that is not a fight. Each has two branches, a choice and a capstone in each, and a mastery badge at the end of every branch. {run:/skills}, then a skill, for its tree.
