# The Melee skill's tree, read by Core's SkillTree (see SkillDef). Three branches stacked on the
# canvas — the first in rows 0–2, the second in 3–5, the third in 6–8 — each with a choice and a capstone, ending in
# its mastery badge: free, open once every other node of the branch not shut by a choice is at its last rank, and
# bringing a mastery feature of its own. Node ids are unique across every skill's tree: a hero's ranks are kept
# as <skill>:<node>.
branches:
  might:
    title: Might
    icon: iron_sword
    blurb: Harder, faster blows; two blades at once, or one great one.
  arms:
    title: Arms
    icon: iron_axe
    blurb: "A school of steel: the sword's edge or the axe's weight."
  fury:
    title: Fury
    icon: redstone
    blurb: "Wounds that bleed, blows that stun, and a fight that feeds itself."

nodes:
