# The Defense skill's tree, read by Core's SkillTree (see SkillDef). Three branches stacked on the
# canvas — the first in rows 0–2, the second in 3–5, the third in 6–8 — each with a choice and a capstone, ending in
# its mastery badge: free, open once every other node of the branch not shut by a choice is at its last rank, and
# bringing a mastery feature of its own. Node ids are unique across every skill's tree: a hero's ranks are kept
# as <skill>:<node>.
branches:
  vitality:
    title: Vitality
    icon: golden_apple
    blurb: More hearts, harder skin, a body that mends and will not die.
  guardian:
    title: Guardian
    icon: shield
    blurb: "A shield that stops everything, and blows that come back at the striker."
  warden:
    title: Warden
    icon: blaze_powder
    blurb: "Fire, blasts and arrows: what the world throws at you, shrugged off."

nodes:
