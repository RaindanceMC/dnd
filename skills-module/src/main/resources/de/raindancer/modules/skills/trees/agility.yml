# The Agility skill's tree, read by Core's SkillTree (see SkillDef). Three branches stacked on the
# canvas — the first in rows 0–2, the second in 3–5, the third in 6–8 — each with a choice and a capstone, ending in
# its mastery badge: free, open once every other node of the branch not shut by a choice is at its last rank, and
# bringing a mastery feature of its own. Node ids are unique across every skill's tree: a hero's ranks are kept
# as <skill>:<node>.
branches:
  shadow:
    title: Shadow
    icon: leather_boots
    blurb: Quick feet, blows that miss you, knives in the back.
  acrobatics:
    title: Acrobatics
    icon: feather
    blurb: "Water, heights and hard landings: a body that goes anywhere, and dashes."
  rogue:
    title: Rogue
    icon: black_dye
    blurb: "Poisoned blades, quiet steps, and gone in a puff of smoke."

nodes:
