# The Magic skill's tree, read by Core's SkillTree (see SkillDef). Three branches stacked on the
# canvas — the first in rows 0–2, the second in 3–5, the third in 6–8 — each with a choice and a capstone, ending in
# its mastery badge: free, open once every other node of the branch not shut by a choice is at its last rank, and
# bringing a mastery feature of its own. Node ids are unique across every skill's tree: a hero's ranks are kept
# as <skill>:<node>.
branches:
  arcana:
    title: Arcana
    icon: enchanted_book
    blurb: Experience, treasure, and the magic items' full strength.
  mysticism:
    title: Mysticism
    icon: brewing_stand
    blurb: "Draughts that last, curses that slide off, and a barrier of light."
  battlemage:
    title: Battlemage
    icon: blaze_rod
    blurb: "Steel and sorcery: hexes on the blade, a shield of experience."

nodes:
