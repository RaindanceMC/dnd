# The Building skill's tree, read by Core's SkillTree (see SkillDef): the mason in rows 0-2, the architect and the
# blueprints (/skills blueprint) in rows 3-5, each ending in its mastery badge. Node ids are unique across every
# skill's tree.
branches:
  mason:
    title: Mason
    icon: bricks
    blurb: Longer arms, blocks to spare, quick feet on a ladder.
  architect:
    title: Architect
    icon: map
    blurb: Blueprints — save what you built, paste it again from your own blocks.

nodes:
  mortar: {branch: mason, at: [0, 1], title: Mortar and Trowel, icon: bricks, ranks: 3, level: 1, level-step: 2, effects: {block_refund: 3}}
  far_reach: {branch: mason, at: [0, 0], title: Long Arms, icon: stick, ranks: 2, level: 2, level-step: 2, requires: [mortar], effects: {block_reach: 0.5}}
  ladder_monkey: {branch: mason, at: [0, 2], title: Ladder Monkey, icon: ladder, ranks: 3, level: 1, level-step: 2, requires: [mortar], effects: {climb_speed: 15}}
  scaffolder: {branch: mason, at: [1, 0], title: Scaffolder, icon: scaffolding, ranks: 2, level: 5, level-step: 2, requires: [far_reach], effects: {block_reach: 0.5}}
  frugal_mason: {branch: mason, at: [1, 1], title: Frugal Mason, icon: stone_bricks, ranks: 3, level: 4, level-step: 2, requires: [mortar], effects: {block_refund: 3}}
  vine_runner: {branch: mason, at: [1, 2], title: Vine Runner, icon: vine, ranks: 2, level: 5, level-step: 2, requires: [ladder_monkey], effects: {climb_speed: 15}}
  tall_reach: {branch: mason, at: [2, 0], title: Tall Reach, icon: end_rod, choice: true, cost: 2, level: 9, requires: [scaffolder], excludes: [spare_stones], effects: {block_reach: 1}}
  builder: {branch: mason, at: [2, 1], title: Builder, icon: brick_stairs, ranks: 2, level: 11, level-step: 3, requires: [frugal_mason], effects: {block_refund: 2, block_reach: 0.5}}
  spare_stones: {branch: mason, at: [2, 2], title: Spare Stones, icon: cobblestone, choice: true, cost: 2, level: 9, requires: [vine_runner], excludes: [tall_reach], effects: {block_refund: 8}}
  spider_climb: {branch: mason, at: [3, 0], title: Spider Climb, icon: spider_eye, ranks: 2, level: 14, level-step: 3, requires: [tall_reach], effects: {climb_speed: 20}}
  master_mason: {branch: mason, at: [3, 1], title: Master Mason, icon: chiseled_stone_bricks, ranks: 2, level: 15, level-step: 3, requires: [builder], effects: {block_refund: 3}}
  steeplejack: {branch: mason, at: [3, 2], title: Steeplejack, icon: lightning_rod, ranks: 1, level: 16, requires: [spare_stones], effects: {climb_speed: 20}}
  quick_mason: {branch: mason, at: [4, 1], title: Quick Hands, icon: golden_pickaxe, capstone: true, cost: 3, level: 30, requires: [spider_climb, master_mason, steeplejack], effects: {quick_undo: 1, block_refund: 4}}
  mason_mastery: {branch: mason, at: [5, 1], title: "Mason's Mastery", icon: decorated_pot, mastery: true, cost: 0, requires: [quick_mason], effects: {bottomless_hod: 1, block_reach: 1}}

  draftsman: {branch: architect, at: [0, 4], title: Draftsman, icon: paper, level: 5, effects: {blueprint_size: 8, blueprint_slots: 1}}
  drafting_table: {branch: architect, at: [0, 3], title: Drafting Table, icon: cartography_table, ranks: 2, level: 6, level-step: 2, requires: [draftsman], effects: {blueprint_slots: 1}}
  careful_measure: {branch: architect, at: [0, 5], title: Careful Measure, icon: string, ranks: 3, level: 6, level-step: 2, requires: [draftsman], effects: {blueprint_thrift: 2}}
  archive: {branch: architect, at: [1, 3], title: Archive, icon: bookshelf, ranks: 2, level: 9, level-step: 2, requires: [drafting_table], effects: {blueprint_slots: 1}}
  larger_plans: {branch: architect, at: [1, 4], title: Larger Plans, icon: map, level: 10, requires: [draftsman], effects: {blueprint_size: 8}}
  spare_mortar: {branch: architect, at: [1, 5], title: Spare Mortar, icon: clay_ball, ranks: 2, level: 9, level-step: 2, requires: [careful_measure], effects: {blueprint_thrift: 2}}
  demolition: {branch: architect, at: [2, 3], title: Demolition, icon: tnt, choice: true, cost: 2, level: 14, requires: [archive], excludes: [careful_builder], effects: {demolition: 1}}
  surveyor: {branch: architect, at: [2, 4], title: Surveyor, icon: spyglass, ranks: 2, level: 15, level-step: 3, requires: [larger_plans], effects: {blueprint_slots: 1}}
  careful_builder: {branch: architect, at: [2, 5], title: Careful Builder, icon: brush, choice: true, cost: 2, level: 14, requires: [spare_mortar], excludes: [demolition], effects: {blueprint_thrift: 8}}
  site_foreman: {branch: architect, at: [3, 3], title: Site Foreman, icon: iron_shovel, level: 18, requires: [demolition], effects: {blueprint_slots: 2}}
  master_plans: {branch: architect, at: [3, 4], title: Master Plans, icon: filled_map, ranks: 2, level: 18, level-step: 3, requires: [surveyor], effects: {blueprint_thrift: 2, blueprint_slots: 1}}
  quartermaster: {branch: architect, at: [3, 5], title: Quartermaster, icon: barrel, ranks: 2, level: 18, level-step: 3, requires: [careful_builder], effects: {blueprint_thrift: 3}}
  grand_design: {branch: architect, at: [4, 4], title: Grand Design, icon: beacon, capstone: true, cost: 3, level: 30, requires: [site_foreman, master_plans, quartermaster], effects: {blueprint_size: 16, blueprint_slots: 3}}
  architect_mastery: {branch: architect, at: [5, 4], title: "Architect's Mastery", icon: compass, mastery: true, cost: 0, requires: [grand_design], effects: {master_architect: 1, blueprint_slots: 2}}
